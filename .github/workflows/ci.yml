name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests make NO external LLM calls (FakeProvider only). Provider keys are never
# set in CI, so the egress guard / offline path is exercised by default.
env:
  MODELTRACEX_PROVIDER: fake
  MODELTRACEX_SECURITY_MODE: local

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev + Phase-1 subsystems)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store,export,lineage]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy modeltracex

      - name: Tests + coverage (offline)
        run: pytest --cov=modeltracex --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
